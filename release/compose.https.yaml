services:
  minimail:
    expose:
      - "3000"
  https:
    image: caddy:2@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${MINIMAIL_DOMAIN:?Set MINIMAIL_DOMAIN in .env}", "--to", "minimail:3000"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - https-data:/data
      - https-config:/config
volumes:
  https-data:
  https-config:
