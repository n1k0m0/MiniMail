services:
  minimail:
    environment:
      MAIL_VPN_PROFILE_ID: ${MAIL_VPN_PROFILE_ID:-private}
      MAIL_VPN_PROFILE_LABEL: ${MAIL_VPN_PROFILE_LABEL:-Private mail VPN}
      MAIL_VPN_PROXY_URL: http://vpn-gateway:3128
    networks:
      - mail-vpn
    depends_on:
      vpn-gateway:
        condition: service_healthy
  vpn-gateway:
    build: ./vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    environment:
      VPN_TARGETS_FILE: /config/targets.json
    volumes:
      - type: bind
        source: ${VPN_CONFIG_DIR:?Set VPN_CONFIG_DIR in .env}
        target: /vpn
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VPN_TARGETS_FILE:?Set VPN_TARGETS_FILE in .env}
        target: /config/targets.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      - mail-vpn
      - vpn-egress
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 130s
networks:
  mail-vpn:
    internal: true
  vpn-egress:
