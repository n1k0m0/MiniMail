name: Checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  updater:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version-file: updater/go.mod, cache: false }
      - working-directory: updater
        run: go test ./...
      - working-directory: updater
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  update-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version-file: updater/go.mod, cache: false }
      - run: sh scripts/test-update.sh
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: minimail-test-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PASSWORD: minimail-test-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: docker exec $(docker ps --filter ancestor=mysql:8.4 -q | head -n 1) mysql -uroot -pminimail-test-only -e "SET GLOBAL max_allowed_packet=134217728"
      - run: npm test
      - run: npm run build
      - run: for file in scripts/*.sh vpn/*.sh release/*.sh; do sh -n "$file"; done
      - run: sh tests/installers.sh
      - shell: pwsh
        run: ./tests/installers.ps1
      - run: docker compose --env-file .env.example config --quiet
        env:
          APP_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MYSQL_PASSWORD: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          MYSQL_ROOT_PASSWORD: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
